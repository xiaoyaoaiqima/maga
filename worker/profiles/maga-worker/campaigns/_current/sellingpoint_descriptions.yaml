version: draft-0.1
source: /Users/luxifa/Downloads/源悦种草活动-ai训练规则.xlsx
purpose: 源悦小红书生文用卖点描述表；被 content_model 通过 sellingpoint_id 引用。
items:
  - sellingpoint_id: S001
    sellingpoint_name: 好消化易吸收
    source_facts:
      - 软分子蛋白
      - 酪蛋白低矿化
      - 荷兰自家牧场NOVAS牛乳
      - 全阶段100%鲜奶一次成粉
    sellingpoint_description: 源悦主打好消化易吸收，资料中提到软分子蛋白和低矿化酪蛋白，配合全阶段100%鲜奶一次成粉，适合围绕宝宝肚肚适应、便便节奏和日常喂养顺畅来表达。
    allowed_expressions:
      - 肚肚更好适应
      - 便便节奏更顺
      - 嗯嗯没那么费劲
      - 日常喂养更省心
      - 吃喝承接更顺
    forbidden_expressions:
      - 治便秘
      - 改善消化不良
      - 调理肠胃
      - 修复肠道
      - 喝了就不上火
      - 立刻见效
  - sellingpoint_id: S002
    sellingpoint_name: 自然奶香，口味清淡
    source_facts:
      - 0激素喂养荷斯坦奶牛
      - 无额外添加香精
      - 无额外作为碳水化合物来源的蔗糖
    sellingpoint_description: 源悦可以从自然奶香、口味清淡切入，适合回应转奶抗拒、喝奶接受度、奶量节奏不稳等问题。表达重点是宝宝比较好接受、过渡更顺，而不是保证爱喝。
    allowed_expressions:
      - 口味比较清淡
      - 自然奶香
      - 娃接受度不错
      - 转奶过渡比较顺
      - 喝奶节奏慢慢稳
    forbidden_expressions:
      - 治厌奶
      - 保证爱喝
      - 一口就爱上
      - 无缝转奶
      - 奶量飞涨
  - sellingpoint_id: S003
    sellingpoint_name: 黄金双益，肚肚环境支持
    source_facts:
      - HN019益生菌
      - 82倍GOS益生元
      - 70+篇婴幼儿临床研究文献背书实证
    sellingpoint_description: 源悦含HN019益生菌和GOS益生元，可作为肚肚状态相关的辅助卖点。生文时建议弱化为日常肚肚环境支持，不要写成治疗或功能承诺。
    allowed_expressions:
      - 日常肚肚环境支持
      - 肚肚状态更稳一点
      - 喂养上更安心
      - 小肚肚舒服些
    forbidden_expressions:
      - 调理肠胃
      - 修复肠道
      - 治疗胀气
      - 改善腹泻
      - 增加有害菌/减少有害菌等强机制结论
  - sellingpoint_id: S004
    sellingpoint_name: 吸收承接，喂养状态更顺
    source_facts:
      - 好消化易吸收
      - 全阶段100%鲜奶一次成粉
      - 天然营养小分子
    sellingpoint_description: 面对光吃不长肉、生长曲线焦虑，不直接承诺长肉，而是表达选口粮时更关注吸收承接和日常喂养状态。可以轻带宝宝吃喝节奏、状态更在线。
    allowed_expressions:
      - 更关注吸收承接
      - 吃喝节奏顺一些
      - 状态看着更在线
      - 抱起来感觉更扎实需谨慎使用
    forbidden_expressions:
      - 喝了就长肉
      - 快速长肉
      - 生长曲线立刻追上
      - 体重明显上涨
      - 保证长高长肉
  - sellingpoint_id: S005
    sellingpoint_name: 8种HMO，日常营养支持
    source_facts:
      - 8种HMO母乳低聚糖
      - 3-GL/4-GL/6-GL/3-SL/6-SL/2-FL/3-FL/LNnT
    sellingpoint_description: 8种HMO适合做换季和日常防护方向的谨慎辅助表达。建议只写日常营养支持和喂养安心，不写提高免疫、少生病或预防中招。
    allowed_expressions:
      - 日常营养支持
      - 换季喂养更安心
      - 基础营养打好
      - 内护力支持
    forbidden_expressions:
      - 提高免疫力
      - 增强免疫力
      - 少生病
      - 预防疾病
      - 防中招
      - 抗病
  - sellingpoint_id: S006
    sellingpoint_name: 五维喂养实证
    source_facts:
      - 5大实证数据支持
      - 上海交通大学医学院人体实验
    sellingpoint_description: 五维喂养实证可作为品牌/产品背书，但不建议在UGC正文中直接罗列数据。若使用，应转成“有实证背书，选起来更安心”的弱表达。
    allowed_expressions:
      - 有实证背书
      - 选择时更安心
      - 不是空口说好吸收
    forbidden_expressions:
      - 无硬便+6倍
      - 无胀气+7倍
      - 夜哭-28%
      - 安睡+73%
      - 用数据承诺个体效果
replacement_map:
  肠胃: 肚肚
  便秘: 嗯嗯困难/拉臭臭费劲/便便不顺
  消化不好: 肚肚不太适应/吃喝承接不顺
  胀气: 肚子鼓鼓/肚肚不舒服
  生病: 中招
  免疫力: 内护力/日常营养支持
  改善: 慢慢顺了/状态更稳/更适应
  治好: 删除，改成体验变顺
