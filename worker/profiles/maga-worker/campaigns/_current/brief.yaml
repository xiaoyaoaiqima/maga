# 测试 brief — 单品种草 (product_seeding)
# 美素佳儿源悦

brief_id: 2026-05-test-meadjohnson-yue
brief_type: xhs_product_seeding_professional_advisor
brand: meadjohnson
products:
  - yue                           # 美素佳儿源悦

campaign:
  name: "美素佳儿源悦"
  start: 2026-05-07
  end: 2026-05-31
  must_keywords:                    # 必带词
    - 美素佳儿
  must_messages: []                 # 单品种草无活动话术

# 痛点配比 (供 painpoint_selling AE 抽样)
painpoint_ratio:
  喂养进食问题: 0.4                 # 主推
  肠胃消化问题: 0.4                 # 主推
  生长发育问题: 0.2                 # 副推

# 拟人化 AE 取该人设语料
persona_target:
  identity: 二胎经验妈妈              # 来自 persona corpus 的 ideal
  voice: 经验老道型
  brand_familiarity: 听说过但没试过

# 内容结构 AE 的偏好
content_structure:
  word_count: "150-250字"
  emoji: "中"                       # 1-2 个 emoji per 段
  title_style: "情绪共情标题"
  layout: "短段落留白"

# 评分门槛
score_threshold: 80                 # 软约束综合分 ≥80 即 pass
max_rewrites: 2                     # 最多重写 2 次

# 软约束权重（可选，未配置则全 1）
soft_weights:
  painpoint_selling: 2              # 痛点卖点是种草的核心
  ai_smell: 1.5                     # AI 味重要
  elegance: 1
