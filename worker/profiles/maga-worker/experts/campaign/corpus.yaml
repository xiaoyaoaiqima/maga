    - l2: 引流
      ideal: 活动报名
      ideal_help: null
      examples: null
      rules:
      - 本文属于“分享+预告”方向，前半部分介绍妈妈班活动整体，帮助读者理解妈妈班活动是什么、一般有哪些环节、参与后有哪些好处、往期活动有哪些亮点和真实收获；后半部分自然过渡到下一场活动预告，重点写清时间、地点、适合人群、主要内容、活动亮点和福利信息。文章要先通过分享建立真实感和信任感，再通过预告提升报名或关注意愿。两部分必须自然衔接，不能像把两篇文章硬拼在一起；前半部分不能写得过满，后半部分也不能太空。
      - 本文属于“活动预告”方向，重点是预告下一场/新一期妈妈班活动，清楚传达活动时间、地点、适合人群、主要内容、核心亮点、礼品福利和参与门槛，吸引更多目标用户关注和报名。文章应突出“下一场活动将有什么值得来”“届时现场能获得什么”“适合哪些妈妈参加”“为什么值得留意”，让读者快速判断这场活动是否适合自己。整体应以预告和招募为主，必须写未来将发生的内容，不要写成往期回顾；往期内容最多只作为一句轻微背书。
      - 活动预告正文必须使用未来语态，例如“你将会看到……”“届时现场将……”“接下来会……”“想象一下……”，所有画面感和情绪词都用于展望未来，不能描述已发生事件；语调要积极、热烈、有感染力，让读者产生“不想错过”的感觉。
      - 活动预告必须包含时间和地点信息，正文需出现类似“xx月xx号，xxx商城xxx楼”的占位格式；不得省略时间、地点，也不得只写“线下门店”“附近商场”等模糊地点。
      - 活动预告开头禁止固定使用“新一期美素佳儿妈妈班……”作为默认首句，应从悬念好奇、直击痛点、场景代入、福利吸引、情感共鸣、稀缺提醒、专业价值、社交分享、对比反转、用户想象、轻松闲聊或数字清单中选择一种自然切入。
      - 活动预告正文可采用“开篇钩子→时间地点→核心亮点→福利价值→适合人群→报名提醒”的结构；如果活动亮点较多，可以用“精彩抢先看”“福利提前看”等小标题分点展开，但必须保持小红书口语感，不要写成官方通知。
      - 活动预告禁止出现“下个月”“下周”等明确相对时间词，统一使用“下一次”“新一期”“接下来”等表达；禁止出现“这次”“现在”“当前”等当前时态词；禁止出现“参加完”“体验过”“整场活动”“现场大家都说”“结束后反馈”等复盘回顾词。
      - 活动预告不能用“我”表达任何个人感受或过去记忆，只能介绍下一场将有什么、用户将看到什么、届时现场会准备什么；结尾可用“名额有限”“私信报名”“手慢无”等轻催动表达。
      - 本文属于“分享+预告”方向，前半部分介绍妈妈班活动整体，帮助读者理解妈妈班活动是什么、一般有哪些环节、参与后有哪些好处、往期活动有哪些亮点和真实收获；后半部分自然过渡到下一场活动预告，重点写清时间、地点、适合人群、主要内容、活动亮点和福利信息。文章要先通过分享建立真实感和信任感，再通过预告提升报名或关注意愿。两部分必须自然衔接，不能像把两篇文章硬拼在一起；前半部分不能写得过满，后半部分也不能太空。
