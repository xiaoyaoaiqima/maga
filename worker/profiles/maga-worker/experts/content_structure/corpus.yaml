    - l2: 干货价值
      ideal: 保姆级干货
      ideal_help: null
      examples: 凡尔赛/反向吐槽模式
      rules:
      - 文章应采用短篇紧凑结构，在有限字数内完成“开头点题、中间展开1到2个核心亮点、结尾收束或提醒”的表达，可根据内容方向灵活偏向往期精彩分享、下场活动预告或前分享后预告，但整体只能围绕一个主重点和一个副重点展开，避免信息铺得过满。
      - 文章整体应围绕一个主重点和一个副重点展开，前段快速建立主题，中段集中写活动亮点或预告信息，后段自然落到收获、福利或提醒上，保证短文读起来完整不散。
      - 文章结构应以“先说重点、再补亮点、最后收尾”为主，在短字数内优先保留最值得写的活动信息，使分享有内容、预告有重点、结合型有自然过渡。
      - 文章应采用短篇聚焦结构，在有限字数内完成开头点题、中段展开1到2个核心亮点、结尾收束或提醒的表达，并根据内容方向灵活偏向往期精彩、下场预告或前分享后预告。
    - l2: 活动预告
      ideal: 未来预告招募
      ideal_help: null
      examples: 脱口秀妈妈班预告/扫码答题赢豪礼
      rules:
      - 文章必须围绕“下一场/新一期活动将发生什么”展开，核心任务是介绍未来活动信息、亮点环节、福利和参与价值，不得描述已发生事件，不得写成活动复盘。
      - 开头必须自然、多样、有吸引力，禁止固定使用“新一期美素佳儿妈妈班……”作为默认首句；可从悬念好奇、直击痛点、场景代入、福利吸引、情感共鸣、稀缺提醒、专业价值、社交分享、对比反转、用户想象、轻松闲聊、数字清单中选择一种切入。
      - 正文建议采用“开篇钩子→时间地点→核心亮点→福利价值→适合人群→报名提醒”的结构；活动亮点可用“精彩抢先看”“福利提前看”等小标题展开，重点写清用户将看到什么、将获得什么、为什么值得来。
      - 全文必须使用未来语态，例如“你将会看到……”“届时现场将……”“接下来会……”“想象一下……”，所有画面感、氛围词和情绪词都用于展望未来，而不是回顾过去。
      - 正文必须出现时间和地点占位词，格式如“xx月xx号，xxx商城xxx楼”，不得省略；必须让读者快速知道活动时间、地点、适合人群、主要内容、亮点环节和参与方式。
      - 表达上要积极、热烈、有感染力，可突出脱口秀、茶点、互动答题、抽奖、实物大奖等具体环节或福利，让读者产生“不想错过”的感觉，但不要变成冷冰冰的官方通知。
      - 红线：禁止出现“下个月”“下周”等明确相对时间词，统一使用“下一次”“新一期”“接下来”；禁止出现“这次”“现在”“当前”等当前时态词；禁止出现“参加完”“体验过”“整场活动”“现场大家都说”“结束后反馈”等复盘词；不能用“我”表达个人感受或过去记忆。
