      ideal_help: null
      examples: null
      rules: null
    - l2: 直叙法
      ideal: 纯享版流水账-沉浸式 Vlog
      ideal_help: null
      examples: 沉浸式 Vlog
      rules:
      - 写作时要少罗列、多转述，用“现场怎么样、亮点是什么、为什么值得看”的方式组织内容，让分享更像亲身感受，预告更像自然提醒，结合型更像顺势带出下场信息。
      - 文章应采用真实分享感与轻提醒结合的写法，先写读者最关心的活动亮点，再顺势补充流程、收获或预告信息，让整篇内容短而不空、轻而不散。
