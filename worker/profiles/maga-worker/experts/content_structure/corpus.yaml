  写作手法:
    description: 具体的表达技巧
    items:
    - l2: 倒叙法
      ideal: 抛悬念开头
      ideal_help: null
      examples: 抛悬念开头、倒叙法
      rules:
      - 写作时应重点前置、短句表达、口语化叙述，把活动亮点、现场感、时间地点、福利信息等内容转化成自然表达，优先写最值得看的1到2个重点，用真实感、轻提醒和轻种草的方式完成分享、预告或两者结合，避免流水账和信息堆砌。
      - 写作时应重点前置、短句表达、口语化叙述，把活动亮点、现场感、时间地点和福利信息转化成自然表达，优先写最值得看的1到2个重点，避免流水账和信息堆砌。
    - l2: null
