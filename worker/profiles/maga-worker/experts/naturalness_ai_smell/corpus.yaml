expert: naturalness_ai_smell
chinese_name: 自然度与AI味AE
output_mode: fixed
score_type: 0-100
groups:
  AI味检测规则:
    description: 模板化、说明书化、AI味表达检测
    items:
      - l2: 模板化开头
        ideal: 具体场景或动作细节开头
        examples: 很多宝妈都会遇到、今天来聊聊、总结一下
        rules: [禁止泛泛共识式, 禁止咨询接待式, 禁止生硬提纲式]
      - l2: 说明书式卖点
        ideal: 卖点融入判断链路
        examples: 连续罗列天然乳脂、OPO、8种HMO、乳铁蛋白
        rules: [禁止卖点清单化, 禁止连续解释句]
