expert: narrative_strategy
chinese_name: 叙事路径与扰动AE
output_mode: fixed
score_type: 0-100
groups:
  叙事路径:
    description: 种草分享的五种叙事路径
    items:
      - l2: A
        ideal: 困扰悬置
        examples: 宝宝状态/喂养场景切入
        rules: [困扰, 观察, 重新审视口粮, 轻松感]
      - l2: B
        ideal: 片段还原
        examples: 具体喂养片段切入
        rules: [不使用具体时间锚点, 困扰自然浮出, 不拔高]
      - l2: C
        ideal: 反差引入
        examples: 吃得不少但状态没跟上
        rules: [反差, 找原因, 重建判断]
      - l2: D
        ideal: 判断重建
        examples: 选择面前拿不定主意
        rules: [具体纠结点, 判断依据, 方向而非唯一答案]
      - l2: E
        ideal: 变化回溯
        examples: 状态变化切入
        rules: [往前倒, 方向感, 禁止具体效果结果]
