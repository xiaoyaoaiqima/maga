expert: business_logic
chinese_name: 业务逻辑总审AE
output_mode: fixed
score_type: 0-100
groups:
  痛点卖点链路:
    description: 痛点类型到核心卖点和表达链路的规则
    items:
      - l2: A1 吸收问题
        ideal: 痛点表现 -> 吃进去是否承接住 -> 天然乳脂/OPO/8种HMO
        examples: 不长肉、饭量不少但状态没跟上、吃进去没承接住
        rules:
          - 核心卖点可选天然乳脂、OPO、8种HMO
          - 不要写成产品直接让宝宝变好
      - l2: A2 肚肚不适/便便问题
        ideal: 痛点表现 -> 肚肚舒适和脂肪结构关注 -> 天然乳脂/OPO
        examples: 吐奶、肚肚不舒服、臭臭节奏乱、便便不规律
        rules:
          - 核心卖点优先天然乳脂/OPO
          - 8种HMO只能作为辅助配方信息
          - 乳铁蛋白不能作为解决吐奶或便便问题的核心原因
      - l2: A3 保护力问题
        ideal: 状态不稳 -> 日常保护力关注 -> 乳铁蛋白
        examples: 容易中招、精神差、恢复慢、脆皮、状态不稳
        rules:
          - 乳铁蛋白可以作为保护力方向
          - 不要承诺少生病、恢复快
      - l2: B类 家长判断问题
        ideal: 选择拿不准 -> 判断依据 -> 天然乳脂/OPO
        examples: 奶量焦虑、不知道吃饱没、混合喂养没头绪
        rules:
          - 用判断依据表达，不给唯一答案
  写作结构:
    description: 真人感和小红书结构规则
    items:
      - l2: 叙事路径
        ideal: 痛点场景 -> 观察判断 -> 卖点依据 -> 轻建议
        examples: 先写一个具体喂养场景，再讲妈妈怎么判断
        rules:
          - 不混用多条叙事路径
          - 不输出路径选择过程
      - l2: 人设视角
        ideal: 经验型建议视角
        examples: 过来人提醒、经验老道型、专业但不端着
        rules:
          - 不显式自称专家
          - 不虚构宝妈第一人称亲历
          - 不以品牌方或活动主办方口吻说话
      - l2: 自然度
        ideal: 具体场景、短段落、卖点融入判断
        examples: 开头有动作细节，正文 3-5 段
        rules:
          - 禁止说明书式卖点清单
          - 禁止“很多宝妈都会遇到”“总结一下”等模板句
          - 收束温和，不拔高
