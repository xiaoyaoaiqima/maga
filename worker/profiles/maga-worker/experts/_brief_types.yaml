# brief_type → 启用 AE 集合 的固定映射
#
# 新版 xhs_product_seeding_professional_advisor 基于线上生文提示词拆分：
# brief 归一 → 痛点分类 → 卖点因果 → 叙事路径 → 人设视角 → 品牌产品 → 合规红线 → 小红书结构 → 自然度/AI味。
#
# 旧版 brief_type 保留，便于回滚和对比。

brief_types:
  xhs_product_seeding_professional_advisor:
    description: 小红书母婴奶粉种草，专业育婴建议视角，痛点卖点链路强约束
    required_aes:
      - brief_interpreter
      - painpoint_anchor
      - sellingpoint_logic
      - narrative_strategy
      - persona_pov
      - brand_product_guard
      - compliance_redline
      - xhs_structure
      - naturalness_ai_smell
    hard_aes:
      - brand_product_guard
      - compliance_redline
    soft_aes:
      - painpoint_anchor
      - sellingpoint_logic
      - narrative_strategy
      - persona_pov
      - xhs_structure
      - naturalness_ai_smell
    default_soft_weights:
      painpoint_anchor: 2
      sellingpoint_logic: 2
      xhs_structure: 1.5
      naturalness_ai_smell: 1.5
      persona_pov: 1
      narrative_strategy: 1
    score_threshold: 85
    max_rewrites: 2
    optional_aes: []

  product_seeding:
    description: 围绕单个产品的痛点-卖点种草，无活动节奏（旧版）
    required_aes:
      - legal
      - platform
      - brand
      - painpoint_selling
      - persona
      - content_structure
      - elegance
      - ai_smell
    optional_aes: []

  offline_mama_class:
    description: 围绕线下妈妈班活动的预告/分享，KOS 视角（旧版）
    required_aes:
      - legal
      - platform
      - brand
      - campaign
      - persona
      - story_elements
      - content_structure
      - elegance
      - ai_smell
    optional_aes: []

  kos_professional:
    description: KOS 专业咨询师视角的产品介绍（旧版）
    required_aes:
      - legal
      - platform
      - brand
      - painpoint_selling
      - persona
      - common_sense
      - elegance
      - ai_smell
    optional_aes: []

  promotion_only:
    description: 限时活动/福利的转化型笔记（旧版）
    required_aes:
      - legal
      - platform
      - brand
      - campaign
      - content_structure
      - elegance
      - ai_smell
    optional_aes: []

  ugc_genuine:
    description: 真实宝妈口吻的种草分享（旧版）
    required_aes:
      - legal
      - platform
      - brand
      - persona
      - story_elements
      - content_structure
      - elegance
      - ai_smell
      - painpoint_selling
    optional_aes: []
