# brief_type → 启用 AE 集合 的固定映射
#
# 新版 xhs_product_seeding_professional_advisor 收敛为硬审核 + 业务逻辑总审：
# 红线审核 → 表达写作审核 → 时间逻辑审核 → 品牌审核 → 业务逻辑总审。
#
# 旧版 brief_type 保留，便于回滚和对比。

brief_types:
  xhs_product_seeding_professional_advisor:
    description: 小红书母婴奶粉种草，专业育婴建议视角，痛点卖点链路强约束
    required_aes:
      - compliance_redline
      - expression_writing
      - time_logic
      - brand_product_guard
      - business_logic
    hard_aes:
      - compliance_redline
      - expression_writing
      - time_logic
      - brand_product_guard
    soft_aes:
      - business_logic
    default_soft_weights:
      business_logic: 1
    score_threshold: 85
    max_rewrites: 2
    optional_aes: []

  product_seeding:
    description: 围绕单个产品的痛点-卖点种草，无活动节奏（旧版）
    required_aes:
      - legal
      - platform
      - brand
      - painpoint_selling
      - persona
      - content_structure
      - elegance
      - ai_smell
    optional_aes: []

  offline_mama_class:
    description: 围绕线下妈妈班活动的预告/分享，KOS 视角（旧版）
    required_aes:
      - legal
      - platform
      - brand
      - campaign
      - persona
      - story_elements
      - content_structure
      - elegance
      - ai_smell
    optional_aes: []

  kos_professional:
    description: KOS 专业咨询师视角的产品介绍（旧版）
    required_aes:
      - legal
      - platform
      - brand
      - painpoint_selling
      - persona
      - common_sense
      - elegance
      - ai_smell
    optional_aes: []

  promotion_only:
    description: 限时活动/福利的转化型笔记（旧版）
    required_aes:
      - legal
      - platform
      - brand
      - campaign
      - content_structure
      - elegance
      - ai_smell
    optional_aes: []

  ugc_genuine:
    description: 真实宝妈口吻的种草分享（旧版）
    required_aes:
      - legal
      - platform
      - brand
      - persona
      - story_elements
      - content_structure
      - elegance
      - ai_smell
      - painpoint_selling
    optional_aes: []
