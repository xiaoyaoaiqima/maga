expert: common_sense
chinese_name: 生活常识Expert
output_mode: fixed
score_type: 0-100
groups:
  合理性规范:
    description: 检验的是不符合生活常识
    items:
    - l2: 生理常识
      ideal: 生理常识
      ideal_help: 月龄、发育、症状、身体反应是否符合正常逻辑
      examples: null
      rules: null
    - l2: 喂养常识
      ideal: 喂养常识
      ideal_help: 奶量、转奶、消化、便便、奶粉使用是否真实合理
      examples: null
      rules:
      - '### 视角 - 你的视角是第一视角的育婴老师/育婴专家，写作风格是**内容随机**、**结构多变**、**表达很专业**。严格禁用时间类通用开场：最近、今天、近期、近日、现阶段、目前、当下、近来等。 严格禁用无意义万能开场：大家好、各位、相信很多人、想必大家都知道、说起
        XX。 - “痛点描述中的内容是宝妈向你倾诉的困扰，你在文章中复述这些痛点时，要用‘宝妈跟我说…’、‘我遇到很多宝妈这样反馈…’等转述方式，而不是直接代入宝妈的第一人称内心感受。” - 不要说每次看到xxx。 - 不要用自己的孩子举例。
        - 不能说你带宝宝逛，你带宝妈逛，宝妈带宝宝逛。 - 禁止将医生/大白和育婴老师/育婴专家做关联，对比，活动中里不能出现医生。 - 禁止出现对产品品牌的宽泛指代，直接植入。 - 禁止使用“宝妈跟我说…”这类主语不完整、场景不清的表达
        - 禁止使用“我直接说了重点”“我直接说了结论”“我直接说了关键” - 禁止使用“宝妈跟我聊、很多宝妈跟我聊、宝妈跟我说、最近很多宝妈跟我聊”这类表达出现在文章开头 ### 卖点表达专业性 - 专业名词必须使用卖点表达中的词，禁止想象。
        - 天然乳脂禁止说成天然来源的乳脂，专业名词不能拆开说。 - 成分前不要乱加形容词，例如珍贵、珍稀、特别。要严谨！ - 禁止用云朵形容天然乳脂。 - 禁止说高含量乳铁蛋白。 - 禁止说优秀的乳铁蛋白，只能说含量优秀的乳铁蛋白 -
        禁止说"专利天然乳脂"，只能说"专利天然乳脂配方"。 - 禁止说多种HMO，必须说8种HMO。 - 禁止说比如皇家美素佳儿，你主推皇家美素佳儿。 - 不能替换，“90%+”和“90%”意义不同。如果带有数字的，必须原样使用【卖点描述】
        ### 用词规范&删改 - “医生” 改为"大白"、“胀气” 改为 “肚子鼓鼓 / 肚肚不舒服”，“生病”改为中招。 - 配方、成分、奶瓶、🍼、禁止出现。 - 禁用「薅羊毛」，删除「这一罐、春天/冬天」等冗余/季节模糊词 - 「全能」改「多样」，「叠满」改「叠好」，「夜闯」改「逛」
        - 「给益生菌加油」改「有益生菌加持」，表述贴合产品逻辑 - 天气相关：严禁将天冷 / 天气变化与宝宝肚肚不适强关联，二者无直接联系，删除此类关联表述 - “小肚腩” 改为 “小肚肚”（避免减肥相关歧义） - “背靠” 改为 “背书”，“小喷泉”（吐奶比喻）删除，直接写
        “喝完奶老是吐奶” ### 表达方式 - 重复表述优化：肚肚不适相关描述避免重复。 - 吐奶/夜奶，肚肚不舒服等状态，和换季不能强关联。 - 换季应该跟宝宝容易中招，内护力相关。 - 禁止使用“当妈的心里…”、“我心里…”、“我家宝宝…”这类宝妈第一人称表达。'
    - l2: 行为常识
      ideal: 行为常识
      ideal_help: 宝宝睡眠、哭闹、互动及妈妈带娃行为是否符合日常
      examples: null
      rules: null
    - l2: 效果常识
      ideal: 效果常识
      ideal_help: 改善速度、效果程度不夸大、不反常识、不玄学
      examples: null
      rules: null
